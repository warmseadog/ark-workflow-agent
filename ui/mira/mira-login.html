<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mira · 登录</title><link rel="stylesheet" href="assets/mira-system.css"></head>
<body class="mira-login-page"><main class="login-shell"><header class="login-brandbar"><a href="mira-cover.html" aria-label="返回 mira 封面"><img src="assets/brand/mira-wordmark-transparent-v1.png" alt="mira"></a><span>氛围感 AI 时尚总监</span></header><section class="login-card" aria-labelledby="login-title"><p class="eyebrow">WELCOME BACK</p><h1 id="login-title">回到你的创作现场。</h1><p class="intro">继续制作，管理你的素材与作品。</p><label class="login-field">用户名<input type="text" placeholder="正式登录服务尚未接入" disabled></label><label class="login-field">密码<input type="password" placeholder="此预览不收集账号或密码" disabled></label><a class="mira-action" href="mira-workspace.html">查看工作台预览 →</a><p class="login-note">这是统一视觉预览，不是真实登录。账号输入已关闭，不发送任何登录请求。</p><div class="login-help"><a class="mira-subtle" href="mira-cover.html">← 返回封面</a><button class="mira-subtle" id="help">账号与登录说明</button></div></section><p class="login-foot">mira · 从一个想法，到一支有氛围的作品。</p></main><dialog class="system-dialog" id="help-dialog" aria-labelledby="help-title"><h2 id="help-title">账号与登录</h2><p>正式版将使用现有账号体系。这轮仅预览统一后的页面、字体和控件，不会替你注册、修改密码或连接旧站。</p><p>生产接入需要现有网站源码及部署通道。当前所有预览跳转都留在 mira 的本地页面内。</p><button class="mira-action" id="close-help">知道了</button></dialog><script>const dialog=document.querySelector('#help-dialog');document.querySelector('#help').onclick=()=>dialog.showModal();document.querySelector('#close-help').onclick=()=>dialog.close();dialog.addEventListener('close',()=>document.querySelector('#help').focus());</script></body></html>
