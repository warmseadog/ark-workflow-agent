<div id="model-settings" class="inline-generation-options">
  <div id="model-settings-form" data-task-options>
    <fieldset id="model-settings-fields" disabled>
      <legend class="sr-only">本次视频生成设置</legend>
      <label class="generation-model-field">视频模型<select name="model" required aria-describedby="generation-model-note"></select></label>
      <label>清晰度<select name="resolution" required></select></label>
      <label>画面比例<select name="ratio" required aria-describedby="generation-ratio-note"></select></label>
      <div class="generation-duration-control">
        <label for="generation-duration-slider" class="generation-duration-heading"><span>时长（秒）</span><output id="generation-duration-note">待选择视频</output></label>
        <input id="generation-duration-slider" class="mira-duration-slider" type="range" min="0" max="29" step="1" value="0" aria-describedby="generation-duration-help generation-source-duration">
        <datalist id="generation-duration-ticks"></datalist>
        <span id="generation-source-duration">读取参考视频后默认使用原片时长</span>
        <button type="button" id="generation-duration-reset" disabled>恢复原片时长</button>
      </div>
      <p id="generation-duration-help" class="generation-duration-help sr-only" aria-live="polite"></p>
    </fieldset>
    <div class="generation-submit-row">
      <label class="generation-audio-field"><input name="generate_audio" type="checkbox" aria-label="生成声音" aria-describedby="generation-audio-note"><span>生成声音</span><output id="generation-audio-state">关闭</output></label>
      <div class="generation-dock">
        <button type="button" class="generation-dock-summary" id="generation-dock-summary">正在读取生成设置…</button>
        <div class="generation-dock-feedback"><span id="generation-readiness" role="status" aria-live="polite">正在恢复素材…</span><button type="button" id="generation-fix" hidden>去添加</button><a href="#tasks" id="generation-view-task" hidden>查看任务</a></div>
        <button class="primary" type="submit" id="studio-generate-submit" disabled aria-describedby="generation-readiness">生成视频 →</button>
        <button class="secondary" type="button" id="variation-toggle" disabled aria-expanded="false" aria-controls="variation-editor">换个拍法</button>
      </div>
    </div>
    <small id="generation-audio-note" class="sr-only">关闭后生成无声视频，可在后期添加配音或音乐。</small>
  </div>
  <p id="generation-model-note" class="sr-only"></p>
  <span id="generation-ratio-note" class="generation-ratio-help">跟随动作视频</span>
  <p id="model-settings-status" class="generation-options-note" role="status" aria-live="polite" hidden></p>
  <p id="model-settings-error" role="alert" hidden></p>
</div>
