<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>修改密码 · 方舟</title>
  <link rel="stylesheet" href="/static/account.css?v=20260928-account-1">
  <script src="/static/account.js?v=20260928-account-1"></script>
</head>
<body class="account-page">
  <main class="auth-layout">
    <a class="account-brand" href="/"><span>方</span> 方舟 <small>账号安全</small></a>
    <section class="auth-card" aria-labelledby="password-title">
      <p class="account-eyebrow" data-account-name></p><h1 id="password-title">修改密码</h1>
      <p id="password-intro" class="account-muted">设置新的登录密码。修改后请重新登录。</p>
      <form id="password-form">
        <fieldset id="password-fields" disabled>
          <label for="current-password">当前密码</label><input id="current-password" name="current_password" type="password" autocomplete="current-password" required>
          <label for="new-password">新密码（至少 8 位）</label><input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required>
          <label for="confirm-password">确认新密码</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required>
          <p id="password-error" class="account-message" role="alert" hidden></p>
          <button type="submit" class="account-primary">保存新密码</button>
        </fieldset>
      </form>
      <nav class="auth-footer account-chrome" aria-label="账号导航"><a id="password-back" href="/" hidden>返回制作台</a><button type="button" data-account-logout data-auth-only hidden>退出登录</button></nav>
    </section>
    <p class="account-banner" data-account-error role="alert" hidden></p>
  </main>
  <script src="/static/password.js?v=20260928-account-1"></script>
</body>
</html>
