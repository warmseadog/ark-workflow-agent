<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>用户与任务 · 方舟</title>
  <link rel="stylesheet" href="/static/account.css?v=20260928-account-1">
  <script src="/static/account.js?v=20260928-account-1"></script>
</head>
<body class="account-page">
  <header class="account-topbar">
    <a class="account-brand" href="/"><span>方</span> 方舟 <small>用户与任务</small></a>
    <nav class="account-chrome" aria-label="账号导航"><a href="/">制作台</a><a href="/people">我的人物</a><a href="/admin/settings" data-admin-only hidden>后台配置</a><span class="account-name" data-account-name data-auth-only hidden></span><a href="/account/password" data-auth-only hidden>修改密码</a><button type="button" data-account-logout data-auth-only hidden>退出登录</button></nav>
  </header>
  <p class="account-banner" data-account-error role="alert" hidden></p>
  <p id="users-access-error" class="account-banner" role="alert" hidden></p>
  <main class="accounts-main" id="users-workspace" hidden>
    <p class="account-eyebrow">工作台管理</p><h1>用户与任务</h1>
    <p class="account-muted">管理账号与任务额度，查看生成用量和操作记录。</p>
    <section class="account-panel" aria-labelledby="create-user-title">
      <div class="account-section-heading"><div><h2 id="create-user-title">创建账号</h2><p>新用户首次登录时需修改初始密码。</p></div></div>
      <form id="create-user-form"><fieldset class="account-form-grid" id="create-user-fields">
        <div><label for="create-username">用户名</label><input id="create-username" name="username" autocomplete="off" spellcheck="false" required></div>
        <div><label for="create-password">初始密码（至少 8 位）</label><input id="create-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required></div>
        <div><label for="create-concurrent">同时生成上限</label><input id="create-concurrent" name="max_concurrent" type="number" min="1" max="10000" step="1" value="1" required></div>
        <div><label for="create-queued">排队上限</label><input id="create-queued" name="max_queued" type="number" min="0" max="10000" step="1" value="10" required></div>
        <button type="submit" class="account-primary">创建账号</button>
      </fieldset></form>
      <p id="create-user-status" class="account-message" role="status" aria-live="polite" hidden></p>
    </section>
    <section class="account-panel" aria-labelledby="users-title">
      <div class="account-section-heading"><div><h2 id="users-title">账号列表</h2><p>调整额度后点击保存；重置密码后，该用户需重新登录并修改密码。</p></div><button id="users-refresh" class="account-secondary" type="button">刷新用户</button></div>
      <p id="users-status" class="account-message" role="status" aria-live="polite" hidden></p>
      <div class="account-table-wrap" tabindex="0" role="region" aria-label="用户列表，可横向滚动"><table class="account-users-table"><thead><tr><th scope="col">用户名</th><th scope="col">角色</th><th scope="col">启用</th><th scope="col">同时生成</th><th scope="col">排队上限</th><th scope="col">账号设置</th><th scope="col">重置密码</th></tr></thead><tbody id="users-list"></tbody></table></div>
    </section>
    <section class="account-panel" aria-labelledby="tasks-title">
      <div class="account-section-heading"><div><h2 id="tasks-title">任务与用量</h2><p>用量统计所选用户的全部任务；状态筛选用于下方列表。生成时长以实际已知秒数计。</p></div></div>
      <form id="task-filter" class="account-filter">
        <label for="task-user">用户<select id="task-user" name="user_id"><option value="">全部用户</option></select></label>
        <label for="task-status">状态<select id="task-status" name="status"><option value="">全部状态</option><option value="queued">排队中</option><option value="running">生成中</option><option value="succeeded">已完成</option><option value="failed">失败</option><option value="needs_attention">需要处理</option><option value="cancelled">已取消</option></select></label>
        <button class="account-secondary" type="submit">查询 / 刷新</button>
      </form>
      <p id="tasks-status" class="account-message" role="status" aria-live="polite" hidden></p>
      <dl class="account-stats"><div><dt>已提交</dt><dd data-stat="submitted">—</dd></div><div><dt>已完成</dt><dd data-stat="succeeded">—</dd></div><div><dt>失败</dt><dd data-stat="failed">—</dd></div><div><dt>生成秒数</dt><dd data-stat="generated_seconds">—</dd></div><div><dt>存储用量</dt><dd data-stat="storage_bytes">—</dd></div></dl>
      <p id="tasks-duration-note" class="account-muted" hidden></p>
      <div class="account-table-wrap" tabindex="0" role="region" aria-label="任务列表，可横向滚动"><table class="account-tasks-table"><thead><tr><th scope="col">任务名称</th><th scope="col">用户</th><th scope="col">状态</th><th scope="col">提交时间</th><th scope="col">时长</th><th scope="col">模型</th></tr></thead><tbody id="admin-tasks-list"></tbody></table></div>
      <nav class="account-pagination" id="tasks-pagination" aria-label="任务分页" hidden><button type="button" class="account-secondary" id="tasks-previous">上一页</button><span id="tasks-page" aria-live="polite"></span><button type="button" class="account-secondary" id="tasks-next">下一页</button></nav>
    </section>
    <section class="account-panel" aria-labelledby="audit-title">
      <div class="account-section-heading"><div><h2 id="audit-title">操作审计</h2><p>查看账号管理与任务操作记录。</p></div><button id="audit-refresh" class="account-secondary" type="button">刷新记录</button></div>
      <p id="audit-status" class="account-message" role="status" aria-live="polite" hidden></p>
      <div class="account-table-wrap" tabindex="0" role="region" aria-label="审计记录，可横向滚动"><table><thead><tr><th scope="col">时间</th><th scope="col">操作人</th><th scope="col">操作</th><th scope="col">对象</th></tr></thead><tbody id="audit-list"></tbody></table></div>
    </section>
  </main>
  <script src="/static/users.js?v=20260928-account-1"></script>
</body>
</html>
