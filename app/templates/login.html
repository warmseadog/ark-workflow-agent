<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="mira 视频创作工作台：从灵感、素材到成片。">
<title>mira · 登录工作台</title>
<link rel="stylesheet" href="/static/account.css?v=20260929-navigation-people-1">
<script src="/static/account.js?v=20260929-navigation-people-1"></script>
<link rel="stylesheet" href="/static/mira/mira-cover.css?v=20260930-production-1">
<link rel="stylesheet" href="/static/mira/mira-system.css?v=20260930-production-1">
<link rel="stylesheet" href="/static/mira/mira-production.css?v=20260930-production-1">
</head>
<body class="mira-cover-page">
<main class="cover" aria-label="mira 作品展示封面">
  <img id="poster" class="media" alt="mira 时尚影像" hidden>
  <video id="film" class="media" muted playsinline loop hidden></video><div class="shade"></div>
  <header class="topbar"><div class="brand-note">MIRA<br>VISUAL STUDIO</div><div class="top-right"><button class="login" id="open-login" type="button" aria-haspopup="dialog" aria-controls="login-dialog">Log in</button></div></header>
  <div class="signature"><img src="/static/mira/brand/mira-wordmark-transparent-v1.png" alt="mira"><p>氛围感 AI 时尚总监</p></div>
  <button class="previous" id="previous" aria-label="上一个作品" disabled><span aria-hidden="true">‹</span><span class="current" id="current">00</span><span class="total">/ <span id="total">00</span></span></button>
  <button class="next" id="next" aria-label="下一个作品" disabled>NEXT <span aria-hidden="true">›</span></button>
  <footer class="bottom"><div class="caption"><p id="kind">MIRA / VISUAL STUDIO</p><h1 id="title">让衣服，拥有自己的氛围。</h1></div><div class="controls"><div class="play-controls"><button id="play" hidden>播放</button><button id="sound" hidden>开启声音</button></div><span class="preview-note" id="preview-note">灵感，从这里开始。</span></div></footer>
  <p class="sr-only" role="status" id="announcement">尚未添加作品。</p>
</main>
<dialog id="login-dialog" aria-labelledby="login-title" aria-describedby="login-description">
 <button type="button" class="close" id="close-login" aria-label="关闭登录框" autofocus>×</button>
 <img class="login-modal-brand" src="/static/mira/brand/mira-wordmark-transparent-v1.png" alt="mira">
 <h2 id="login-title">回到你的创作现场。</h2>
 <p class="intro" id="login-description">继续制作，管理你的素材与作品。</p>
 <form id="login-form">
  <label class="login-field" for="login-username">用户名<input id="login-username" name="username" autocomplete="username" spellcheck="false" required maxlength="256"></label>
  <label class="login-field" for="login-password">密码<input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
  <p id="login-error" class="login-error" role="alert" hidden></p>
  <button class="mira-action" type="submit" id="login-submit">登录工作台</button>
 </form>
 <p class="login-note">使用管理员分配的账号登录。需要账号或重置密码，请联系管理员。</p>
</dialog>
<script src="/static/mira/mira-cover.js?v=20260930-production-1"></script>
<script src="/static/login.js?v=20260929-account-2"></script>
</body></html>
