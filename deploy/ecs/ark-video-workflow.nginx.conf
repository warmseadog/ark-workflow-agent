# Independent HTTPS entry point; the original 443 website remains unchanged.
# Host/Origin are normalized only after these checks and Basic authentication.
map $http_origin $ark_video_bad_origin {
    default 1;
    "" 0;
    "https://118.196.7.195:8443" 0;
}
map "$request_method:$http_sec_fetch_site" $ark_video_cross_site_write {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):cross-site$ 1;
}

server {
    listen 8443 ssl http2;
    server_name 118.196.7.195;
    ssl_certificate /etc/letsencrypt/live/118.196.7.195/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/118.196.7.195/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Company video workspace";
    auth_basic_user_file /etc/nginx/ark-video-workflow.htpasswd;
    client_max_body_size 512m;
    client_body_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # Only these one-time portrait routes are reachable without the workbench password.
    location ^~ /auth/portrait/ {
        auth_basic off;
        access_log off;
        # Upstream failures otherwise include the callback token in the error log.
        error_log /dev/null crit;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host 127.0.0.1:18080;
        proxy_set_header Origin "";
        proxy_set_header Authorization "";
        proxy_read_timeout 45s;
    }

    location / {
        if ($ark_video_bad_origin) { return 403; }
        if ($ark_video_cross_site_write) { return 403; }
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:18080;
        proxy_set_header Origin "";
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
    }
}
